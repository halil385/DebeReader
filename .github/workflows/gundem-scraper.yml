jobs:
  scrape:
    runs-on: ubuntu-latest
    
    # Görevin en fazla 1 saat sürmesine izin ver.
    timeout-minutes: 30 

    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v3

      - name: Node.js Kurulumu
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Gündem Kazıma İşlemini Başlat
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node gundem-scraper.js
